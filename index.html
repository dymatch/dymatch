<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>讀伴計畫｜找一個人，一起讀書</title>
<meta name="description" content="讀伴計畫幫你配對讀書夥伴。有人在旁邊，比較讀得下去。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF1EE;
    --ink: #16243A;
    --muted: #55637A;
    --lamp: #F2B632;
    --teal: #2F6F6B;
    --white: #FFFFFF;
    --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height: 1.75; font-size: 17px; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--lamp); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* Hero */
  .hero { padding: 64px 0 72px; }
  .hero .wrap { display: grid; grid-template-columns: 1.15fr 1fr; gap: 48px; align-items: center; }
  h1 { font-family: var(--serif); font-weight: 900; font-size: clamp(34px, 5.6vw, 56px); line-height: 1.25; margin: 0 0 20px; letter-spacing: .02em; }
  .lead { color: var(--muted); max-width: 32em; margin: 0 0 28px; }
  .btn { display: inline-block; background: var(--ink); color: var(--white); font: 700 17px var(--sans); padding: 14px 28px; border: 0; border-radius: 6px; text-decoration: none; cursor: pointer; }
  .btn:hover { background: #22375A; }

  /* Seat map: the one memorable element */
  .room { justify-self: center; width: 100%; max-width: 380px; }
  .seats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .seat { aspect-ratio: 1; border-radius: 8px; background: #D5DDD8; }
  .seat.on { animation: light .5s ease forwards; animation-delay: var(--d); }
  .seat.you { background: transparent; border: 2.5px dashed var(--teal); }
  @keyframes light { to { background: var(--lamp); box-shadow: 0 0 18px rgba(242,182,50,.55); } }
  .room p { margin: 18px 0 0; font-size: 15px; color: var(--muted); }
  .room b { color: var(--teal); }

  /* Steps */
  .steps { padding: 8px 0 72px; }
  .steps h2, .join h2 { font-family: var(--serif); font-size: 28px; margin: 0 0 28px; }
  .step-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; counter-reset: s; }
  .step-list li { border-top: 3px solid var(--ink); padding-top: 14px; counter-increment: s; }
  .step-list li::before { content: counter(s); font: 900 28px var(--serif); color: var(--teal); }
  .step-list strong { display: block; font-size: 19px; }
  .step-list span { color: var(--muted); font-size: 15.5px; }

  /* Join form */
  .join { background: var(--ink); color: var(--white); padding: 64px 0 72px; }
  .join .sub { color: #B8C3D6; margin: -14px 0 32px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 24px; max-width: 760px; }
  .full { grid-column: 1 / -1; }
  label, legend { display: block; font-weight: 700; font-size: 15.5px; margin-bottom: 6px; padding: 0; }
  .hint { font-weight: 400; color: #B8C3D6; font-size: 14px; }
  input[type=text], select, textarea { width: 100%; font: 400 16px var(--sans); padding: 11px 12px; border-radius: 6px; border: 2px solid transparent; background: var(--white); color: var(--ink); }
  input:focus, select:focus, textarea:focus { border-color: var(--lamp); outline: none; }
  fieldset { border: 0; margin: 0; padding: 0; }
  .opts { display: flex; flex-wrap: wrap; gap: 10px 22px; }
  .opts label { font-weight: 400; display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; }
  .opts input, .consent input { width: 18px; height: 18px; accent-color: var(--lamp); }
  .consent { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 14.5px; color: #B8C3D6; }
  .consent input { margin-top: 5px; flex: none; }
  .submit { background: var(--lamp); color: var(--ink); }
  .submit:hover { background: #F7C550; }
  .submit[disabled] { opacity: .6; cursor: wait; }
  .msg { margin: 0; padding: 14px 16px; border-radius: 6px; font-size: 15.5px; display: none; }
  .msg.ok { display: block; background: #DDEFE0; color: #17402A; }
  .msg.err { display: block; background: #F8DCDC; color: #6B1D1D; }

  footer { padding: 28px 0; font-size: 14.5px; color: var(--muted); }
  footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 800px) {
    .hero .wrap { grid-template-columns: 1fr; gap: 36px; }
    .hero { padding-top: 40px; }
    .step-list { grid-template-columns: 1fr; gap: 24px; }
    form { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .seat.on { animation: none; background: var(--lamp); }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div>
      <h1>一個人讀不下去，<br>就找個人坐在旁邊。</h1>
      <p class="lead">讀伴計畫幫你配對讀書夥伴。不用互相講課，只要彼此在場，大家都比較讀得下去。</p>
      <a class="btn" href="#join">登記找讀伴</a>
    </div>
    <div class="room" aria-hidden="true">
      <div class="seats" id="seats"></div>
      <p>其他人已經在讀了，<b>你的位子</b>還空著。</p>
    </div>
  </div>
</header>

<section class="steps">
  <div class="wrap">
    <h2>怎麼運作</h2>
    <ol class="step-list">
      <li><strong>填寫報名表</strong><span>告訴我們你想讀什麼、什麼時段有空。</span></li>
      <li><strong>我們幫你配對</strong><span>依科目、時段和讀書方式，找適合的讀伴。</span></li>
      <li><strong>約好一起讀</strong><span>我們會用你留的聯絡方式通知你，之後你們自己約。</span></li>
    </ol>
  </div>
</section>

<section class="join" id="join">
  <div class="wrap">
    <h2>登記找讀伴</h2>
    <p class="sub">約一分鐘填完。配對完成後，我們會主動聯絡你。</p>

    <form id="form" novalidate>
      <div>
        <label for="nickname">暱稱</label>
        <input type="text" id="nickname" name="nickname" required maxlength="30" autocomplete="nickname">
      </div>
      <div>
        <label for="school_dept">學校與系所</label>
        <input type="text" id="school_dept" name="school_dept" required maxlength="60" placeholder="例：政大企管">
      </div>
      <div>
        <label for="grade">年級</label>
        <select id="grade" name="grade" required>
          <option value="">請選擇</option>
          <option>高中</option><option>大一</option><option>大二</option><option>大三</option><option>大四以上</option><option>研究所</option><option>其他</option>
        </select>
      </div>
      <div>
        <label for="goal">最近想讀什麼</label>
        <input type="text" id="goal" name="goal" required maxlength="80" placeholder="例：會計學期中考、多益">
      </div>
      <fieldset class="full">
        <legend>讀書方式</legend>
        <div class="opts">
          <label><input type="radio" name="mode" value="線上" required> 線上</label>
          <label><input type="radio" name="mode" value="實體"> 實體</label>
          <label><input type="radio" name="mode" value="都可以"> 都可以</label>
        </div>
      </fieldset>
      <fieldset class="full">
        <legend>可配對時段 <span class="hint">（可複選）</span></legend>
        <div class="opts">
          <label><input type="checkbox" name="slots" value="平日白天"> 平日白天</label>
          <label><input type="checkbox" name="slots" value="平日晚上"> 平日晚上</label>
          <label><input type="checkbox" name="slots" value="週末"> 週末</label>
        </div>
      </fieldset>
      <div class="full">
        <label for="contact">聯絡方式 <span class="hint">（IG 帳號或 LINE ID）</span></label>
        <input type="text" id="contact" name="contact" required maxlength="60">
      </div>
      <label class="consent full">
        <input type="checkbox" id="consent" required>
        <span>我同意讀伴計畫僅為了配對而使用這些資料，並在配對後把我的聯絡方式提供給對方。</span>
      </label>
      <div class="full">
        <button class="btn submit" type="submit" id="submitBtn">登記找讀伴</button>
      </div>
      <p class="msg full" id="msg" role="status"></p>
    </form>
  </div>
</section>

<footer>
  <div class="wrap">
    <span>讀伴計畫 stu.dymatch</span>
    <a href="https://www.instagram.com/stu.dymatch" target="_blank" rel="noopener">Instagram @stu.dymatch</a>
  </div>
</footer>

<script>
  // ===== 設定：換成你 Supabase 專案的值（Project Settings → API）=====
  const CONFIG = {
    SUPABASE_URL: "https://oltuouvipqvooyzrsywv.supabase.co",       // 例："https://xxxx.supabase.co"（結尾不用 /rest/v1/）
    SUPABASE_ANON_KEY: "sb_publishable_WdBVwvhnNfq1oJKACFKeJA_relnymUk"   // Publishable key（sb_publishable_ 開頭）或舊版 anon key，可公開；絕對不要放 secret / service_role key
  };

  // 座位圖：亮起的是「正在讀書的人」，虛線的是你的位子
  (function () {
    const lit = [0, 2, 3, 6, 9, 10, 14, 15, 17, 19, 22];
    const you = 8;
    const box = document.getElementById("seats");
    for (let i = 0; i < 24; i++) {
      const s = document.createElement("div");
      s.className = "seat" + (i === you ? " you" : "");
      if (lit.includes(i)) {
        s.classList.add("on");
        s.style.setProperty("--d", (lit.indexOf(i) * 0.18 + 0.3).toFixed(2) + "s");
      }
      box.appendChild(s);
    }
  })();

  // 報名表單
  const form = document.getElementById("form");
  const msg = document.getElementById("msg");
  const btn = document.getElementById("submitBtn");

  function show(type, text) { msg.className = "msg full " + type; msg.textContent = text; }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) { form.reportValidity(); return; }

    const data = new FormData(form);
    const row = {
      nickname: data.get("nickname").trim(),
      school_dept: data.get("school_dept").trim(),
      grade: data.get("grade"),
      goal: data.get("goal").trim(),
      mode: data.get("mode"),
      slots: data.getAll("slots"),
      contact: data.get("contact").trim()
    };

    btn.disabled = true; btn.textContent = "送出中…";
    try {
      if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY) {
        console.log("尚未設定 Supabase，示範模式，資料未儲存：", row);
      } else {
        const base = CONFIG.SUPABASE_URL.replace(/\/rest\/v1\/?$/, "").replace(/\/$/, "");
        const headers = {
          "Content-Type": "application/json",
          "apikey": CONFIG.SUPABASE_ANON_KEY,
          "Prefer": "return=minimal"
        };
        // 舊版 anon key（eyJ 開頭）需要 Authorization；新版 publishable key 只需 apikey
        if (CONFIG.SUPABASE_ANON_KEY.startsWith("eyJ")) headers["Authorization"] = "Bearer " + CONFIG.SUPABASE_ANON_KEY;
        const res = await fetch(base + "/rest/v1/signups", {
          method: "POST",
          headers,
          body: JSON.stringify(row)
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
      }
      form.reset();
      show("ok", "已收到！配對完成後，我們會用你留的聯絡方式聯絡你。");
    } catch (err) {
      console.error(err);
      show("err", "送出失敗。請確認網路後再試一次，還是不行的話，請私訊 IG @stu.dymatch。");
    } finally {
      btn.disabled = false; btn.textContent = "登記找讀伴";
    }
  });
</script>
</body>
</html>
